plugins {
    id 'net.neoforged.moddev'
}

version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = '26.1.2.71'

    mods {
        leafsleep {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':resource:LeafSleep:leafsleep-common')
    implementation(project(':neoforge:neoforge-v26_1_R1')) { transitive = false }
    compileOnly 'com.mojang:brigadier:1.3.10'
}
